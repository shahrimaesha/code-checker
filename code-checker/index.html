<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Plagiarism & Code Similarity Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Automated Plagiarism & Code Similarity Checker</h2>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="showTab('batch-mode', this)">📁 Batch File Upload</button>
        <button class="tab-btn" onclick="showTab('text-mode', this)">📝 Pairwise Text Check</button>
    </div>

    <form id="checkerForm">
        <!-- Batch File Mode -->
        <div id="batch-mode" class="tab-content active">
            <div class="box">
                <h3>Select Code Files (Multiple)</h3>
                <input type="file" id="batchFiles" name="files[]" multiple>
            </div>
        </div>

        <!-- Pairwise Text Mode -->
        <div id="text-mode" class="tab-content">
            <div class="box">
                <h3>Source Code 1</h3>
                <textarea id="code1" placeholder="Paste code 1..."></textarea>
            </div>
            <div class="box">
                <h3>Source Code 2</h3>
                <textarea id="code2" placeholder="Paste code 2..."></textarea>
            </div>
        </div>

        <button type="button" class="btn-check" onclick="processCheck()">Check Plagiarism</button>
    </form>

    <!-- Result Area -->
    <div id="result-box">
        <h3 style="margin-top:0;">Analysis Results</h3>
        
        <div id="single-result-layout" style="display:none;" class="result-layout">
            <div class="result-info">
                <p id="result-text" style="font-size: 16px; margin: 10px 0;"></p>
                <div class="progress-bar-bg">
                    <div id="progress-bar" class="progress-bar-fill">0%</div>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="chartCanvas" width="140" height="140"></canvas>
                <p style="font-size: 12px; color: #666; margin-top: 5px;">Similarity Pie Chart</p>
            </div>
        </div>

        <div id="batch-result-layout" style="display:none;">
            <div id="matrix-table-container"></div>
            <div class="chart-container" style="margin-top:20px;">
                <h4>Average Similarity Graph (Bar Chart)</h4>
                <canvas id="barCanvas" width="600" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
let currentMode = 'batch';

function showTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
    currentMode = (tabId === 'batch-mode') ? 'batch' : 'text';
}

function processCheck() {
    let formData = new FormData();
    formData.append('mode', currentMode);

    if (currentMode === 'batch') {
        let fileInput = document.getElementById('batchFiles');
        if (fileInput.files.length < 2) {
            alert('Please select at least 2 files for batch checking!');
            return;
        }
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append('files[]', fileInput.files[i]);
        }
    } else {
        let c1 = document.getElementById('code1').value;
        let c2 = document.getElementById('code2').value;
        if (!c1.trim() || !c2.trim()) {
            alert('Please paste both code snippets!');
            return;
        }
        formData.append('code1', c1);
        formData.append('code2', c2);
    }

    let xhr = new XMLHttpRequest();
    xhr.open('POST', 'check.php', true);
    xhr.onload = function() {
        if (this.status === 200) {
            let res = JSON.parse(this.responseText);
            if (res.error) { alert(res.error); return; }

            document.getElementById('result-box').style.display = 'block';

            if (res.type === 'batch') {
                document.getElementById('single-result-layout').style.display = 'none';
                document.getElementById('batch-result-layout').style.display = 'block';

                let output = '<table class="matrix-table"><thead><tr><th>Files</th>';
                res.filenames.forEach(name => output += `<th>${name}</th>`);
                output += '</tr></thead><tbody>';

                let averages = {};

                res.filenames.forEach(f1 => {
                    output += `<tr><td><b>${f1}</b></td>`;
                    let sum = 0;
                    res.filenames.forEach(f2 => {
                        let score = res.matrix[f1][f2];
                        if(f1 !== f2) sum += score;
                        let bg = score > 70 ? '#F9ECEC' : (score > 35 ? '#FDEBD0' : '#E8F8F5');
                        output += `<td style="background:${bg}; font-weight:bold;">${score}%</td>`;
                    });
                    averages[f1] = res.filenames.length > 1 ? (sum / (res.filenames.length - 1)).toFixed(1) : 100;
                    output += '</tr>';
                });
                output += '</tbody></table>';

                document.getElementById('matrix-table-container').innerHTML = output;
                drawBarChart(res.filenames, averages);
            } else {
                document.getElementById('batch-result-layout').style.display = 'none';
                document.getElementById('single-result-layout').style.display = 'flex';

                document.getElementById('result-text').innerHTML = `<b>Similarity:</b> ${res.similarity}% — <span style="color:${res.color}">${res.status}</span>`;
                
                let bar = document.getElementById('progress-bar');
                bar.style.width = res.similarity + '%';
                bar.style.backgroundColor = res.color;
                bar.innerText = res.similarity + '%';

                drawPieChart(res.similarity, res.color);
            }
        }
    };
    xhr.send(formData);
}

function drawPieChart(similarityPercent, color) {
    let canvas = document.getElementById('chartCanvas');
    let ctx = canvas.getContext('2d');
    let centerX = canvas.width / 2;
    let centerY = canvas.height / 2;
    let radius = 60;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let matchedAngle = (similarityPercent / 100) * (2 * Math.PI);
    
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, 0, matchedAngle);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, matchedAngle, 2 * Math.PI);
    ctx.closePath();
    ctx.fillStyle = '#e0e0e0';
    ctx.fill();
}

function drawBarChart(filenames, averages) {
    let canvas = document.getElementById('barCanvas');
    let ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let chartHeight = 150;
    let barWidth = 40;
    let gap = 20;
    let startX = 30;

    filenames.forEach((name, index) => {
        let avg = averages[name];
        let h = (avg / 100) * chartHeight;
        let x = startX + index * (barWidth + gap);
        let y = 170 - h;

        ctx.fillStyle = avg > 70 ? '#430e0c' : (avg > 35 ? '#9f633de2' : '#13542c');
        ctx.fillRect(x, y, barWidth, h);

        ctx.fillStyle = '#333';
        ctx.font = '11px Arial';
        ctx.fillText(avg + '%', x + 5, y - 5);
        ctx.fillText(name.substring(0, 6), x, 188);
    });
}
</script>

</body>
</html>
